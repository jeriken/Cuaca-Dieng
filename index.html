<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cuaca Dieng</title>
  <meta name="description" content="Informasi Embun Es Dieng">

  <meta name="theme-color" content="#fafaf9">

  <link rel="preconnect" href="https://api.thingspeak.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <script>
    // Initialize dark mode and toolbar color from localStorage
    var dark = localStorage.getItem('cuaca-theme') === 'dark'
    if (dark) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
    var meta = document.querySelector('meta[name="theme-color"]')
    if (meta) meta.setAttribute('content', dark ? '#0a1524' : '#fafaf9')
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R3LQW2709T"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-R3LQW2709T');
  </script>
</head>

</body>
